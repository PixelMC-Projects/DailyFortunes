plugins {
 id 'fabric-loom' version '1.7.4'
 id 'com.gradleup.shadow' version '8.3.6'
}
version='0.3.1'
group='cn.pixelmc.dailyfortunes'
base { archivesName='dailyfortunes-fabric-1.21.1' }
java { toolchain { languageVersion=JavaLanguageVersion.of(21) }; withSourcesJar() }
repositories { maven { url='https://maven.aliyun.com/repository/public' }; mavenCentral() }
configurations { jdbcDriver; compileOnly.extendsFrom jdbcDriver; runtimeOnly.extendsFrom jdbcDriver }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
 jdbcDriver('org.mariadb.jdbc:mariadb-java-client:3.5.6') { transitive=false }
 jdbcDriver('com.h2database:h2:2.3.232') { transitive=false }
}
loom { runs { server { programArg '--nogui' } } }
tasks.named('jar',Jar).configure { archiveClassifier='unshaded-dev'; from('LICENSE','NOTICE','THIRD_PARTY.md') }
tasks.named('shadowJar').configure {
 archiveClassifier='dev'; configurations=[project.configurations.jdbcDriver]
 relocate 'org.mariadb.jdbc','cn.pixelmc.dailyfortunes.vendor.mariadb'
 relocate 'org.h2','cn.pixelmc.dailyfortunes.vendor.h2'
 mergeServiceFiles(); exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA','module-info.class','META-INF/versions/**'
 from('LICENSE','NOTICE','THIRD_PARTY.md')
}
tasks.named('remapJar').configure { dependsOn 'shadowJar'; inputFile=tasks.named('shadowJar').flatMap { it.archiveFile }; archiveClassifier='' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
sourceSets { checks { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + configurations.jdbcDriver } }
['serviceChecks':'ServiceChecks','serviceRegressionChecks':'ServiceRegressionChecks','worldStorageChecks':'WorldStorageChecks','platformIntegrationChecks':'PlatformIntegrationChecks','rpcResponseChecks':'RpcResponseChecks','displaySelectionChecks':'DisplaySelectionChecks'].each { taskName,entry ->
 tasks.register(taskName,JavaExec) { dependsOn 'checksClasses'; classpath=sourceSets.checks.runtimeClasspath; mainClass='cn.pixelmc.dailyfortunes.'+entry }
 tasks.named('check') { dependsOn taskName }
}
tasks.register('packagedStorageChecks',JavaExec) {
 dependsOn 'shadowJar','checksClasses'
 classpath=files(tasks.named('shadowJar').flatMap { it.archiveFile }) + sourceSets.checks.runtimeClasspath
 mainClass='cn.pixelmc.dailyfortunes.ServiceChecks'
 systemProperty 'dailyfortunes.packaged','true'
 doFirst { systemProperty 'dailyfortunes.packagedJar',tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath }
}
tasks.named('check') { dependsOn 'packagedStorageChecks' }


// Development-only runtime checks. They are separate from the distributable main JAR.
sourceSets { smoke { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
loom { mods { dailyfortunes { sourceSet sourceSets.main }; dailyfortunes_smoke { sourceSet sourceSets.smoke } } }

loom { accessWidenerPath=file('src/main/resources/dailyfortunes.accesswidener') }

tasks.named('runServer') { dependsOn 'smokeClasses'; classpath += sourceSets.smoke.output; standardInput=System.in }
tasks.named('runClient') { dependsOn 'smokeClasses'; classpath += sourceSets.smoke.output }
loom { runs { client { programArgs '--width','1280','--height','800'; vmArg '-Xmx1G' } } }

if(project.hasProperty('flow')) tasks.named('runServer') { jvmArgs '-Ddailyfortunes.flow=true' }
if(project.hasProperty('connectAddress')) tasks.named('runClient') { jvmArgs '-Ddailyfortunes.connect='+project.property('connectAddress') }

if(project.hasProperty('capture')) tasks.named('runClient') { jvmArgs '-Ddailyfortunes.capture=true' }

loom { runs { client { runDir='run-client' }; server { runDir='run-server' } } }
